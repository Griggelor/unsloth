# SPDX-License-Identifier: AGPL-3.0-only
# Dedicated PR31 helper formatting gate: pinned Ruff plus repository post-pass.
# No write token, no push, no production code changes.
name: QA PR31 Formatter Fixed Point
on:
  push:
    branches: ['qa/agent-history-pr31-fast-gates']
    paths:
      - '.github/workflows/qa-pr31-formatter-fixed-point.yml'
      - 'scripts/qa-pr31-*.py'
      - 'scripts/run_ruff_format.py'
      - 'scripts/enforce_kwargs_spacing.py'
permissions:
  contents: read
jobs:
  formatter:
    name: Pinned Ruff 0.6.9 and kwargs fixed-point QA scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact repository Ruff version
        run: python -m pip install 'ruff==0.6.9'
      - name: Show exact formatted diff, then enforce fixed point
        shell: bash
        run: |
          set -euo pipefail
          # Use Git's tracked set rather than a brittle list of disposed
          # experiments. New helpers get checked; removed helpers never fail.
          mapfile -d '' -t qa_scripts < <(git ls-files -z -- 'scripts/qa-pr31-*.py')
          test "${#qa_scripts[@]}" -ge 2
          printf 'Checking %s tracked PR31 helper scripts\n' "${#qa_scripts[@]}"
          python scripts/run_ruff_format.py "${qa_scripts[@]}"
          git diff --check
          git diff -- "${qa_scripts[@]}"
          git diff --exit-code -- "${qa_scripts[@]}"
