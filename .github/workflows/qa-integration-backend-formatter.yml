name: Integration Backend Formatter QA
on:
  push:
    branches: [qa/integration-backend-20261010]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.6.9
      - name: Normalize changed Python files and verify fixed point
        run: |
          python scripts/run_ruff_format.py tests/test_omni_text_only_load.py tests/test_chunked_mask_block_sequence_ids.py
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess, sys
          paths = ['tests/test_omni_text_only_load.py', 'tests/test_chunked_mask_block_sequence_ids.py']
          before = [hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths]
          subprocess.run([sys.executable, 'scripts/run_ruff_format.py', *paths], check=True)
          after = [hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths]
          if before != after:
              raise SystemExit('NOT_FIXED_POINT')
          print('FIXED_POINT_VERIFIED')
          for p in paths:
              print('FORMATTED_FILE_BEGIN::' + p)
              print(base64.b64encode(Path(p).read_bytes()).decode())
              print('FORMATTED_FILE_END::' + p)
          PY
