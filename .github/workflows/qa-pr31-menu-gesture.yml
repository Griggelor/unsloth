# SPDX-License-Identifier: AGPL-3.0-only
# Isolated test-driver A/B. No production changes, no release assertion.
name: QA PR31 Menu Gesture Diagnosis
on:
  push:
    branches: ['qa/agent-history-pr31-fast-gates']
    paths:
      - '.github/workflows/qa-pr31-menu-gesture.yml'
      - 'scripts/qa-pr31-menu-gesture.py'
      - '.github/scripts/retry-with-apt-lock.sh'
      - '.github/actions/install-unsloth-local/**'
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    name: Real Radix four-mode E2E using fresh keyboard-open gesture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve exact PR30 SHA
        id: target
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/30" --jq '[.head.sha, .head.ref, .head.repo.full_name, .state, (.draft|tostring)] | join("|")')"
          IFS='|' read -r SHA BRANCH REPO STATE DRAFT <<< "$META"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$BRANCH" = "qa/agent-history-main-sync-20261012"
          test "$STATE" = "open"
          test "$DRAFT" = "true"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PR30 target: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout PR30 exact source in root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ steps.target.outputs.sha }}'
          persist-credentials: false
      - name: Assert pinned exact PR30 checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
      - name: Fetch PR31 probe only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          path: qa-harness
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Minimal Linux apt prerequisite
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'
      - name: Install disposable Studio without a model
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: '${{ secrets.GITHUB_TOKEN }}'
          hf-token: ''
      - name: Chromium and Playwright
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python -m pip install 'playwright>=1.45,<2'
          bash .github/scripts/retry-with-apt-lock.sh python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()'; then
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()'
          fi
      - name: Boot disposable Studio and mask bootstrap password
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port 18899 \
            --log logs/qa-menu-gesture-server.log --pid-var QA_GESTURE_PID
          bash .github/scripts/wait-for-health.sh --port 18899 \
            --log logs/qa-menu-gesture-server.log --tmp /tmp/qa-gesture-health.json
          PW="$(cat ~/.unsloth/studio/auth/.bootstrap_password)"
          echo "::add-mask::$PW"
          echo "QA_GESTURE_PW=$PW" >> "$GITHUB_ENV"
      - name: Use strict fresh keyboard interaction (test only)
        run: |
          python qa-harness/scripts/qa-pr31-menu-gesture.py \
            --test-file tests/studio/playwright_agent_history_scroll.py
      - name: Run real full Radix menu/browser regression
        timeout-minutes: 10
        run: |
          python tests/studio/playwright_agent_history_scroll.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$QA_GESTURE_PW" --messages 400
      - name: Retain failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-menu-fresh-keyboard-probe
          path: |
            logs/qa-menu-gesture-server.log
            logs/agent-history/
          if-no-files-found: warn
          retention-days: 7
