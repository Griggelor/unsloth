# QA ONLY, temporary workflow: not part of upstream submission.
name: QA Agent History Thumb Height Lock V2 and Windows EXE
on:
  push:
    branches:
      - qa/agent-history-thumb-height-lock-v2-ci-20261015
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: Window contracts and pinned formatter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Full frontend validation on final upstream baseline
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run i18n:check:strict
          npm test
          npm run build
          npm run bundle:check
      - name: Focused unit contracts
        working-directory: studio/frontend
        run: |
          node --experimental-strip-types --test \
            tests/agent-history-native-thumb.test.ts \
            tests/agent-history-navigation.test.ts \
            tests/agent-history-scroll-intent-gate.test.ts \
            tests/agent-history-dom-budget.test.ts \
            tests/agent-history-dom-preference.test.ts \
            tests/agent-history-scroll-window.test.ts \
            tests/agent-history-search.test.ts \
            tests/agent-history-preference-policy.test.ts
      - name: Ruff 0.6.9 custom fixed point
        run: |
          python -m pip install 'ruff==0.6.9'
          python scripts/run_ruff_format.py tests/studio/playwright_agent_history_dom_sweep.py tests/studio/playwright_agent_history_scroll.py
          git diff -- tests/studio/playwright_agent_history_dom_sweep.py tests/studio/playwright_agent_history_scroll.py
          git diff --exit-code -- tests/studio/playwright_agent_history_dom_sweep.py tests/studio/playwright_agent_history_scroll.py
      - name: Report pinned formatting patch for synthetic stress fixtures
        run: |
          python -m pip install 'ruff==0.6.9'
          python scripts/run_ruff_format.py \
            tests/studio/playwright_agent_history_dom_churn_stress.py \
            tests/studio/playwright_agent_history_idle_scroll_stress.py
          git --no-pager diff -- \
            tests/studio/playwright_agent_history_dom_churn_stress.py \
            tests/studio/playwright_agent_history_idle_scroll_stress.py
          git diff --exit-code -- \
            tests/studio/playwright_agent_history_dom_churn_stress.py \
            tests/studio/playwright_agent_history_idle_scroll_stress.py
  browser:
    name: Focused browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [menu, native-thumb, dom, idle-scroll, dom-churn-50k, dom-churn-200k, dom-churn-400k, gc-retention]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux prerequisites
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Unsloth on disposable runner, without a model
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          hf-token: ''
      - name: Download Chromium without implicit apt
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python -m pip install 'playwright>=1.45,<2'
          bash .github/scripts/retry-with-apt-lock.sh python -m playwright install chromium
      - name: Probe browser and install missing system libraries only when necessary
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          if python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()'; then
            echo 'Chromium launches without additional system packages'
          else
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()'
          fi
      - name: Start disposable Studio and mask bootstrap password
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port 18899 \
            --log logs/studio_agent_history.log --pid-var STUDIO_AGENT_HISTORY_PID
          bash .github/scripts/wait-for-health.sh --port 18899 \
            --log logs/studio_agent_history.log --tmp /tmp/health_agent_history.json
          OLD="$(cat ~/.unsloth/studio/auth/.bootstrap_password)"
          echo "::add-mask::$OLD"
          echo "AGENT_HISTORY_PW=$OLD" >> "$GITHUB_ENV"
      - name: Menu, K=2..32, scrolling, search, per-thread setting
        if: matrix.suite == 'menu'
        timeout-minutes: 10
        run: |
          python tests/studio/playwright_agent_history_scroll.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" --messages 400
      - name: One-gesture native scrollbar to transcript origin
        if: matrix.suite == 'native-thumb'
        timeout-minutes: 10
        run: |
          python tests/studio/playwright_agent_history_scroll.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" --messages 400 \
            --critical-scrollbar-only
      - name: Independent 4000-message/100k-DOM typing sweep
        if: matrix.suite == 'dom'
        timeout-minutes: 10
        run: |
          mkdir -p logs/agent-history
          python tests/studio/playwright_agent_history_dom_sweep.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" --output logs/agent-history/dom-sweep.json
      - name: Synthetic completed-run idle/resume heavy DOM scroll
        if: matrix.suite == 'idle-scroll'
        timeout-minutes: 12
        run: |
          mkdir -p logs/agent-history
          python tests/studio/playwright_agent_history_idle_scroll_stress.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" \
            --messages 800 --cards 400 --rounds 3 \
            --output logs/agent-history/idle-scroll-stress.json
      - name: Large DOM churn 50k / 200k / 400k
        if: startsWith(matrix.suite, 'dom-churn-')
        timeout-minutes: 22
        run: |
          mkdir -p logs/agent-history
          case "${{ matrix.suite }}" in
            dom-churn-50k) BUDGET=50000 ;;
            dom-churn-200k) BUDGET=200000 ;;
            dom-churn-400k) BUDGET=400000 ;;
            *) exit 1 ;;
          esac
          python tests/studio/playwright_agent_history_dom_churn_stress.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" --messages 1000 \
            --elements "$BUDGET" --rounds 1 \
            --output "logs/agent-history/dom-churn-${BUDGET}.json"
      - name: Same-anchor forced-GC DOM retention sweep
        if: matrix.suite == 'gc-retention'
        timeout-minutes: 22
        run: |
          mkdir -p logs/agent-history
          python tests/studio/playwright_agent_history_dom_churn_stress.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$AGENT_HISTORY_PW" --messages 1000 \
            --elements 50000 --rounds 1 --retention-cycles 30 \
            --output logs/agent-history/gc-retention-50k.json
      - name: Cleanup and diagnostics
        if: always()
        run: |
          kill "$STUDIO_AGENT_HISTORY_PID" 2>/dev/null || true
          mkdir -p logs/server-logs
          cp -r ~/.unsloth/studio/logs/. logs/server-logs/ 2>/dev/null || true
      - name: Upload evidence even for failed gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-history-focused-${{ matrix.suite }}
          path: |
            logs/agent-history/
            logs/studio_agent_history.log
            logs/server-logs/
          if-no-files-found: warn
          retention-days: 1
  windows-exe:
    name: Windows unsigned QA executable
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify QA source matches tested revision
        shell: pwsh
        run: |
          $base = '1d3b250c6b1ec22966f0aa76b790b5147af5a262'
          if ((git rev-parse HEAD^).Trim() -ne $base) { throw 'Build branch no longer contains exactly the tested source parent' }
          $diff = @(git diff --name-only HEAD^ HEAD)
          if ($diff.Count -ne 1 -or $diff[0] -ne '.github/workflows/qa-agent-history-thumb-height-lock-v2-ci.yml') {
            throw ('Unexpected source files differ from tested source: ' + ($diff -join ', '))
          }
          Write-Host "Verified exact tested source parent $base; QA workflow is the only difference"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: 'false'
          workspaces: studio/src-tauri -> target
      - name: Lockfile supply chain audit
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Frontend dependencies and app bundle
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Install pinned Tauri CLI
        run: npm ci --prefix studio --no-fund --no-audit
      - name: Build unsigned Windows executable without installer
        run: npx --prefix studio tauri build --debug --no-bundle
      - name: Verify the final frontend includes the virtualizer
        shell: pwsh
        run: |
          $marker = Get-ChildItem 'studio/frontend/dist/assets' -Filter '*.js' -Recurse -File |
            Select-String -SimpleMatch 'data-agent-history-scroll-list' |
            Select-Object -First 1
          if ($null -eq $marker) { throw 'Predictive Agent History renderer marker missing in final Tauri frontend' }
          Write-Host 'Confirmed virtualized renderer is present in final compiled frontend'
      - name: Verify and stage executable
        shell: pwsh
        run: |
          $exe = 'studio/src-tauri/target/debug/unsloth-studio.exe'
          if (-not (Test-Path $exe)) { throw "Tauri did not produce $exe" }
          New-Item -ItemType Directory -Force 'qa-windows-exe' | Out-Null
          $name = 'unsloth-studio-Agent-History-Thumb-Height-Lock-R3V2-QA-UNSIGNED.exe'
          Copy-Item $exe "qa-windows-exe/$name"
          $hash = (Get-FileHash "qa-windows-exe/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            build_kind = 'QA_UNSIGNED_DEBUG_EXE_NO_INSTALLER'
            tested_source_commit = '1d3b250c6b1ec22966f0aa76b790b5147af5a262'
            workflow_commit = ('${{ github.sha }}')
            build_run = ('${{ github.run_id }}')
            source_changes_since_test = 'QA_WORKFLOW_ONLY'
            backend_bundled = $false
            backend_version_unchanged = $true
            official_release = $false
            filename = $name
            sha256 = $hash
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content 'qa-windows-exe/QA_MANIFEST.json' -Encoding utf8
          @(
            'UNSLOTH AGENT HISTORY QA - UNSIGNED DEBUG EXE'
            'This is a standalone Tauri debug binary, NOT an installer or official update.'
            'The executable does NOT bundle or replace the separately installed Python backend.'
            'Use a disposable QA profile: do not launch against production or sensitive chat data.'
            'Upstream-rebased agent-history virtualizer only; Off = original ProgressiveMessages; Fixed/Dynamic available globally and per chat. No context-fix or Working-UI experiments.'
            'The prior tested source had 4/48 transient extreme-wheel QA failures; rerun on the new upstream baseline before PR.'
            'Test Dynamic and Fixed in both wheel directions, native scrollbar, search, thread switch, streaming, memory.'
          ) | Set-Content 'qa-windows-exe/QA_README.txt' -Encoding utf8
          Write-Host "SHA256: $hash"
      - name: Upload unsigned QA EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-history-thumb-height-lock-r3v2-windows-exe
          path: qa-windows-exe/*
          retention-days: 7
          if-no-files-found: error
