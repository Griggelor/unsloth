name: QA Staged CI Formatter
on:
  push:
    branches: [qa/agent-history-staged-ci-20261010]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.6.9
      - name: Format and verify fixed point
        run: |
          python scripts/run_ruff_format.py tests/studio/playwright_agent_history_perf.py tests/test_chunked_mask_block_sequence_ids.py
          python - <<'PY'
          import base64, hashlib, subprocess, sys
          from pathlib import Path
          paths = ['tests/studio/playwright_agent_history_perf.py','tests/test_chunked_mask_block_sequence_ids.py']
          before = [hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths]
          subprocess.run([sys.executable, 'scripts/run_ruff_format.py', *paths], check=True)
          after = [hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths]
          assert before == after, 'NOT_FIXED_POINT'
          print('FIXED_POINT_VERIFIED')
          for p in paths:
              print('FORMATTED_FILE_BEGIN::' + p)
              print(base64.b64encode(Path(p).read_bytes()).decode())
              print('FORMATTED_FILE_END::' + p)
          PY
