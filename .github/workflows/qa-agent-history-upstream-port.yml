# Temporary fork-only validation. Delete before any upstream submission.
name: QA Agent History Upstream Port
on:
  push:
    branches:
      - qa/upstream-agent-history-candidate-20261014
    paths:
      - 'studio/frontend/**'
      - 'tests/studio/playwright_agent_history_*.py'
      - '.github/workflows/qa-agent-history-upstream-port.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-history-upstream-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install frontend without scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Agent History unit contracts
        run: |
          node --experimental-strip-types --test \
            tests/agent-history-dom-budget.test.ts \
            tests/agent-history-dom-preference.test.ts \
            tests/agent-history-navigation.test.ts \
            tests/agent-history-scroll-intent-gate.test.ts \
            tests/agent-history-scroll-window.test.ts \
            tests/agent-history-search.test.ts \
            tests/agent-history-preference-policy.test.ts
      - name: TypeScript check
        run: npm run typecheck
      - name: Production frontend build
        run: npm run build
      - name: Bundle budget
        run: npm run bundle:check
      - name: Report exact revision
        run: |
          echo "Verified upstream-port commit: ${{ github.sha }}"
