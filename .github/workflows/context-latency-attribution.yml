# SPDX-License-Identifier: AGPL-3.0-only
name: Context latency attribution experiment
on:
  push:
    branches:
      - experiment/context-latency-attribution-20261016
    paths:
      - 'studio/backend/utils/context_latency_trace.py'
      - 'studio/backend/core/inference/checkpoint.py'
      - 'studio/backend/core/inference/context_window.py'
      - 'studio/backend/core/rag/conversation_archive.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/context_perf/test_context_latency_trace.py'
      - '.github/workflows/context-latency-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-pure-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax-check changed production files
        run: |
          python -m py_compile studio/backend/utils/context_latency_trace.py studio/backend/core/inference/checkpoint.py studio/backend/core/inference/context_window.py studio/backend/core/rag/conversation_archive.py studio/backend/storage/studio_db.py studio/backend/main.py
      - name: Trace privacy and passthrough test
        run: python -m unittest discover -s studio/backend/tests/context_perf -p 'test_context_latency_trace.py' -v
