# QA-only desktop executable. No installer, updater publication or signing.
name: QA Context Live Working Windows EXE
on:
  push:
    branches:
      - qa/context-live-phases-windows-20261014
    paths:
      - '.github/workflows/qa-agent-history-windows-exe.yml'
      - 'studio/frontend/**'
      - 'studio/backend/**'
      - '.github/workflows/qa-context-live-working-windows-exe.yml'
      - 'studio/src-tauri/**'
      - 'tests/studio/playwright_agent_history_scroll.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  windows-exe:
    name: Windows unsigned QA executable
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Assert immutable test HEAD
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Checkout SHA does not match PR head' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: 'false'
          workspaces: studio/src-tauri -> target
      - name: Lockfile supply chain audit
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Frontend dependencies and app bundle
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Install pinned Tauri CLI
        run: npm ci --prefix studio --no-fund --no-audit
      - name: Build unsigned Windows executable without installer
        run: npx --prefix studio tauri build --debug --no-bundle
      - name: Verify and stage executable
        shell: pwsh
        run: |
          $exe = 'studio/src-tauri/target/debug/unsloth-studio.exe'
          if (-not (Test-Path $exe)) { throw "Tauri did not produce $exe" }
          New-Item -ItemType Directory -Force 'qa-windows-exe' | Out-Null
          Copy-Item $exe 'qa-windows-exe/unsloth-studio-QA-UNSIGNED.exe'
          $exeHash = (Get-FileHash 'qa-windows-exe/unsloth-studio-QA-UNSIGNED.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            build_kind = 'QA_UNSIGNED_EXE_NO_INSTALLER'
            source_commit = '${{ github.sha }}'
            source_branch = '${{ github.ref_name }}'
            diagnostic_feature = 'live-context-phase-ui-and-backend-progress'
            backend_pairing_required = 'Run the studio/backend code at the exact same source_commit; EXE alone does not replace the Python service.'
            workflow_run_id = '${{ github.run_id }}'
            executable_name = 'unsloth-studio-QA-UNSIGNED.exe'
            executable_sha256 = $exeHash
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content 'qa-windows-exe/QA_MANIFEST.json' -Encoding utf8
          Write-Host "QA EXE SHA256: $exeHash"
      - name: Explain backend pairing
        shell: pwsh
        run: |
          @'
          QA ONLY: This is an unsigned Tauri debug executable without a bundled Python backend.
          To see detailed Working stages, run the Studio Python backend from the exact
          QA_MANIFEST.json source_commit. Normal installations with an older backend
          will still show generic Working... (the probe endpoint will be missing).
          The QA branch enables content-free tracing; do not use real private logs.
          Disable backend tracing with UNSLOTH_CONTEXT_PERF_TRACE=0.
          '@ | Set-Content 'qa-windows-exe/QA_README.txt'
      - name: Upload unsigned QA EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-live-working-windows-qa-unsigned-exe
          path: qa-windows-exe/*
          retention-days: 7
          if-no-files-found: error
