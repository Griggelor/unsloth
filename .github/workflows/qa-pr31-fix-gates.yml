  startup-bundle:
    name: Frontend build + unchanged startup budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve exact current PR30 SHA
        id: target
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
