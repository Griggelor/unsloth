# SPDX-License-Identifier: AGPL-3.0-only
# PR31: independent read-only focused QA on exact PR30 HEAD at job start.
# Re-run one job for the latest PR30 SHA. Not a full release gate.
name: QA PR31 Fast Fix Gates

on:
  push:
    branches: ['qa/agent-history-pr31-fast-gates']
    paths: ['.github/workflows/qa-pr31-fix-gates.yml']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-pr31-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Fast policy/scroll intent/DOM and lazy import regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Resolve exact current PR30 SHA
        id: target
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/30" --jq '[.head.sha, .head.ref, .head.repo.full_name, .state, (.draft|tostring)] | join("|")')"
          IFS='|' read -r SHA BRANCH REPO STATE DRAFT <<< "$META"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$BRANCH" = "qa/agent-history-main-sync-20261012"
          test "$STATE" = "open"
          test "$DRAFT" = "true"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PR30 target exact SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ steps.target.outputs.sha }}'
          persist-credentials: false
      - name: Assert exact PR30 checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Targeted pure regression contracts
        working-directory: studio/frontend
        run: |
          node --experimental-strip-types --test \
            tests/agent-history-navigation.test.ts \
            tests/agent-history-scroll-intent-gate.test.ts \
            tests/agent-history-dom-budget.test.ts \
            tests/agent-history-dom-preference.test.ts \
            tests/agent-history-scroll-window.test.ts \
            tests/agent-history-search.test.ts \
            tests/agent-history-preference-policy.test.ts \
            tests/agent-history-lazy-tool-bundle.test.ts
      - name: Pinned Ruff 0.6.9 browser fixture format
        run: |
          python -m pip install 'ruff==0.6.9'
          python scripts/run_ruff_format.py tests/studio/playwright_agent_history_scroll.py
          git diff --exit-code -- tests/studio/playwright_agent_history_scroll.py
  native-scrollbar:
    name: Linux Chromium real-thumb + dynamic buffer modes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve exact current PR30 SHA
        id: target
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/30" --jq '[.head.sha, .head.ref, .head.repo.full_name, .state, (.draft|tostring)] | join("|")')"
          IFS='|' read -r SHA BRANCH REPO STATE DRAFT <<< "$META"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$BRANCH" = "qa/agent-history-main-sync-20261012"
          test "$STATE" = "open"
          test "$DRAFT" = "true"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PR30 target exact SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ steps.target.outputs.sha }}'
          persist-credentials: false
      - name: Assert exact PR30 checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Minimal Linux dependencies
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'
      - name: Install local Studio without model
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: '${{ secrets.GITHUB_TOKEN }}'
          hf-token: ''
      - name: Chromium + Playwright
        timeout-minutes: 7
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '120'
        run: |
          python -m pip install 'playwright>=1.45,<2'
          bash .github/scripts/retry-with-apt-lock.sh python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()'; then
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()'
          fi
      - name: Boot disposable Studio and mask password
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port 18899 \
            --log logs/qa-critical-scrollbar-server.log --pid-var QA_SCROLL_PID
          bash .github/scripts/wait-for-health.sh --port 18899 \
            --log logs/qa-critical-scrollbar-server.log --tmp /tmp/qa-scroll-health.json
          PW="$(cat ~/.unsloth/studio/auth/.bootstrap_password)"
          echo "::add-mask::$PW"
          echo "QA_SCROLL_PW=$PW" >> "$GITHUB_ENV"
      - name: Real scrollbar drag + post-drag anchor stability (high and low)
        timeout-minutes: 9
        run: |
          python tests/studio/playwright_agent_history_scroll.py \
            --url http://127.0.0.1:18899 --username unsloth \
            --password "$QA_SCROLL_PW" --messages 400 --critical-scrollbar-only
      - name: Retain failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-critical-native-scrollbar
          path: |
            logs/qa-critical-scrollbar-server.log
            logs/agent-history/
          if-no-files-found: warn
          retention-days: 7

