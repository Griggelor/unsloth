# SPDX-License-Identifier: AGPL-3.0-only
name: Context Latency Windows Portable QA (isolated backend)
on:
  push:
    branches:
      - experiment/context-latency-portable-qa-20261017
    paths:
      - 'studio/backend/**'
      - 'studio/src-tauri/**'
      - '.github/workflows/context-latency-windows-portable.yml'
      - '.github/scripts/context-latency-qa/portable/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-qa-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      UNSLOTH_NO_TORCH: '1'
      UNSLOTH_SKIP_AUTOSTART: '1'
      UNSLOTH_ISOLATE_UV_CACHE: '1'
      UNSLOTH_PORTABLE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert checked-out source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Wrong portable QA source commit' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: 'false'
          workspaces: studio/src-tauri -> target
      - name: QA privacy and PowerShell syntax tests
        shell: pwsh
        run: |
          python -m unittest discover -s studio/backend/tests/context_perf -p 'test_context_latency_trace.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python diagnostic tests failed' }
          Get-ChildItem .github/scripts/context-latency-qa/portable/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell parse error: $errors" }
          }
      - name: Synthetic read-only host chat database import regression
        shell: pwsh
        run: |
          python .github/scripts/context-latency-qa/tests/test_import_chat_database.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic QA chat import tests failed' }
      - name: Verify source dependency lockfiles
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Build frontend
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Install pinned Tauri CLI
        run: npm ci --prefix studio --no-fund --no-audit
      - name: Build portable-only desktop executable with separate application identifier
        run: npx --prefix studio tauri build --debug --no-bundle --features context-portable-qa --config studio/src-tauri/tauri.context-qa.conf.json
      - name: Provision independent backend on clean CI runner (no PyTorch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'qa-context-portable'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $env:UNSLOTH_STUDIO_HOME = Join-Path $stage 'qa-runtime\studio'
          $env:UNSLOTH_HOME = Join-Path $stage 'qa-runtime'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --local --no-torch --skip-autostart --isolated-uv-cache
          if ($LASTEXITCODE -ne 0) { throw "Isolated Unsloth backend provisioning failed ($LASTEXITCODE)" }
          $venv = Join-Path $env:UNSLOTH_STUDIO_HOME 'unsloth_studio'
          $py = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path $py)) { throw 'Independent QA Python missing' }
          # The source checkout is editable during --local installation. Replace it with
          # an immutable non-editable wheel so no wheel code can refer to CI's workspace.
          New-Item -ItemType Directory -Force qa-source-wheel | Out-Null
          python -m pip wheel . --no-deps -w qa-source-wheel
          if ($LASTEXITCODE -ne 0) { throw 'Source wheel build failed' }
          $wheel = @(Get-ChildItem qa-source-wheel/unsloth-*.whl)
          if ($wheel.Count -ne 1) { throw 'Expected precisely one locally built unsloth wheel' }
          python -m pip --python $py install --no-deps --force-reinstall $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Replacing editable install with frozen source wheel failed' }
          $mod = Join-Path $venv 'Lib\site-packages\studio\backend\utils\context_latency_trace.py'
          if (-not (Test-Path $mod)) { throw 'The built wheel did not include the instrumentation' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'studio\backend\utils\context_latency_trace.py'
          if ((Get-FileHash -Algorithm SHA256 $mod).Hash -ne (Get-FileHash -Algorithm SHA256 $source).Hash) {
            throw 'Bundled diagnostic Python bytes do not match exact commit'
          }
          $base = @(Get-ChildItem (Join-Path $env:UNSLOTH_STUDIO_HOME 'python') -Recurse -File -Filter python.exe | Where-Object { $_.FullName -notlike '*\Scripts\*' })
          if ($base.Count -ne 1) { throw 'Base CPython must be shipped inside portable QA root' }
          if (-not (Test-Path (Join-Path $stage 'qa-runtime\llama.cpp'))) { throw 'Private llama.cpp runtime missing' }
          # The uv Scripts/python.exe is an ABSOLUTE trampoline, not a relocatable CPython
          # launcher. Rebuild its script interpreter with the private CPython stdlib venv
          # launcher, while preserving all third-party wheels installed in Lib/site-packages.
          $basePython = $base[0].FullName
          & $basePython -m venv --without-pip $venv
          if ($LASTEXITCODE -ne 0) { throw 'Private standard-library venv rebuild failed' }
          & $py -I -c 'import studio.backend.utils.context_latency_trace; import unsloth_cli'
          if ($LASTEXITCODE -ne 0) { throw 'Private CPython venv rebuild broke installed backend' }
      - name: Relocation, Unicode path, and negative private runtime tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'qa-context-portable'
          $runtime = Join-Path $stage 'qa-runtime'
          $helper = '.github/scripts/context-latency-qa/portable/Assert-Portable-Python.ps1'
          $moved = Join-Path $env:RUNNER_TEMP 'QA mit Leerzeichen Ü ö'
          if (Test-Path $moved) { throw 'Unexpected existing relocation directory' }
          Move-Item -LiteralPath $runtime -Destination $moved
          try {
            & $helper -RuntimeRoot $moved
            $py = Join-Path $moved 'studio/unsloth_studio/Scripts/python.exe'
            $backup = "$py.private-test"
            Move-Item -LiteralPath $py -Destination $backup
            try {
              $failed = $false
              try { & $helper -RuntimeRoot $moved } catch { $failed = $true }
              if (-not $failed) { throw 'NEGATIVE TEST FAILED: missing interpreter did not fail closed' }
            } finally { Move-Item -LiteralPath $backup -Destination $py }
            & $helper -RuntimeRoot $moved
          } finally { Move-Item -LiteralPath $moved -Destination $runtime }
          & $helper -RuntimeRoot $runtime
          # Reproduce installations retaining both uv's minor alias and exact CPython patch.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .github/scripts/context-latency-qa/portable/Test-Dual-Private-Python.ps1 -RuntimeRoot $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Dual CPython portable QA regression failed' }
          $original = Join-Path $runtime 'studio/unsloth_studio/Scripts/python.exe'
          $binHash = (Get-FileHash -Algorithm SHA256 $original).Hash
          Write-Host "Portable Python SHA256=$binHash"
      - name: Direct QA EXE launch must fail closed before native UI initialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'studio/src-tauri/target/debug/unsloth-studio.exe'
          Remove-Item Env:UNSLOTH_CONTEXT_QA_VALIDATED -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath (Resolve-Path $exe) -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 2) { throw "Ungated QA EXE did not fail closed ($($proc.ExitCode))" }
      - name: Test desktop portable resolver negative cases (Rust)
        shell: pwsh
        run: |
          Push-Location studio/src-tauri
          try {
            cargo test --features context-portable-qa portable_qa_backend_fail_closed_even_when_other_backends_exist -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Desktop fail-closed resolver test failed' }
          } finally { Pop-Location }
      - name: Prepare portable ZIP payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'qa-context-portable'
          Copy-Item -LiteralPath 'studio/src-tauri/target/debug/unsloth-studio.exe' -Destination (Join-Path $stage 'Unsloth-Context-QA-Portable.exe')
          Copy-Item .github/scripts/context-latency-qa/portable/* $stage -Force
          # Remove transient source and download caches, without disturbing installed wheels.
          foreach ($path in @('qa-runtime\studio\uv-cache','qa-runtime\studio\cache\uv','qa-runtime\studio\logs')) {
            $target = Join-Path $stage $path
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          $exe = Join-Path $stage 'Unsloth-Context-QA-Portable.exe'
          $manifest = [ordered]@{
            kind = 'ISOLATED_WINDOWS_X64_CONTEXT_LATENCY_QA_PORTABLE'
            source_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            exe_sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            runtime = 'qa-runtime/studio/unsloth_studio/Scripts/python.exe'
            python_sha256 = (Get-FileHash -Algorithm SHA256 (Join-Path $stage 'qa-runtime/studio/unsloth_studio/Scripts/python.exe')).Hash.ToLowerInvariant()
            diagnostic_sha256 = (Get-FileHash -Algorithm SHA256 (Join-Path $stage 'qa-runtime/studio/unsloth_studio/Lib/site-packages/studio/backend/utils/context_latency_trace.py')).Hash.ToLowerInvariant()
            importer_sha256 = (Get-FileHash -Algorithm SHA256 (Join-Path $stage 'Import-Chat-Database.py')).Hash.ToLowerInvariant()
            mode = 'NO_TORCH_GGUF_CHAT_CPU_CAPABILITY_TO_BE_VERIFIED'
            no_system_backend_patch = $true
            updater_disabled = $true
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $stage 'QA_MANIFEST.json') -Encoding utf8
          $files = @(Get-ChildItem -LiteralPath $stage -Recurse -File)
          Write-Host "Portable QA files=$($files.Count) totalBytes=$(($files | Measure-Object Length -Sum).Sum)"
      - name: Relocate entire QA package, manifest, private backend health and synthetic host canary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/context-latency-qa/portable/Smoke-Relocated-Backend.ps1 -PackageRoot (Join-Path $env:GITHUB_WORKSPACE 'qa-context-portable') -SourceSHA $env:GITHUB_SHA
      - name: Upload private-backend portable Windows QA package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-latency-windows-portable-own-backend
          path: qa-context-portable/**
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
